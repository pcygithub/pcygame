<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#33205e,#100b20 65%);color:#fff;font-family:system-ui,"Noto Sans TC",sans-serif;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:20px}.title{text-align:center}.title h1{font-size:42px;margin:5px}.title p{color:#cfc6e8}.panel{background:#ffffff0d;border:1px solid #ffffff1c;border-radius:22px;padding:18px;box-shadow:0 20px 70px #0007}.draw{display:block;margin:15px auto;background:#ffd43b;color:#281b00;border:0;border-radius:30px;padding:14px 42px;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 0 30px #ffd43b66}.draw:disabled{opacity:.5;cursor:not-allowed}.stage{position:relative;height:570px;overflow:hidden;border-radius:20px;background:linear-gradient(#101827,#07101c);border:2px solid #ffffff22}.box{position:absolute;left:50%;top:30px;transform:translateX(-50%);width:min(760px,88%);height:430px;border:7px solid #b9d8e6aa;border-radius:30px 30px 80px 80px;background:#8bd5f00b;box-shadow:inset 0 0 35px #8be7ff22,0 0 35px #6cdcff22;overflow:hidden}.box:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,#fff2,transparent 12%,transparent 86%,#fff2);pointer-events:none}

.machine{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);width:170px;height:110px;border-radius:25px 25px 12px 12px;background:linear-gradient(#555,#222);border:3px solid #999;box-shadow:0 10px 30px #0009;z-index:5}
.slot{position:absolute;top:-20px;left:45px;width:80px;height:35px;background:#111;border-radius:50%;border:2px solid #666;z-index:1}
.out{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:105px;height:55px;border-radius:50% 50% 0 0;background:#050505;border:2px solid #444;border-bottom:0;z-index:10}

.ball{position:absolute;width:32px;height:32px;border-radius:50%;box-shadow:inset -6px -7px 10px #0005,0 2px 5px #0008;z-index:2;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#111}.ball:after{content:"";position:absolute;width:9px;height:5px;border-radius:50%;background:#fff8;top:5px;left:7px}

.output-ball {
  position: absolute;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  box-shadow: inset -6px -7px 10px #0005, 0 4px 12px #000a;
  z-index: 6;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 900;
  color: #111;
  opacity: 0;
  pointer-events: none;
  left: 50%;
  top: 420px;
  transform: translate(-50%, 0) scale(0.9);
}
.output-ball:after {
  content: ""; position: absolute; width: 10px; height: 6px; border-radius: 50%; background: #fff8; top: 6px; left: 8px;
}

@keyframes pushOutBall {
  0% {
    opacity: 1;
    top: 415px;
    transform: translate(-50%, 0) scale(0.8);
    z-index: 6;
  }
  35% {
    opacity: 1;
    top: 480px;
    transform: translate(-50%, 0) scale(0.9);
    z-index: 6;
  }
  65% {
    opacity: 1;
    top: 495px;
    transform: translate(-50%, 0) scale(1.3);
    z-index: 15;
  }
  100% {
    opacity: 1;
    top: 250px;
    transform: translate(-50%, -50%) scale(2.8);
    z-index: 25;
  }
}

.result{position:absolute;right:22px;top:22px;min-width:200px;text-align:center;padding:14px 20px;border-radius:16px;background:#0008;border:1px solid #fff2;z-index:20}
.result .big{font-size:25px;font-weight:900}.result .small{color:#ddd;margin-top:3px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{padding:11px;text-align:center;background:#ffffff0a;border-radius:12px}.stat b{display:block;font-size:25px}.history{margin-top:15px;max-height:170px;overflow:auto}.history div{padding:7px;border-bottom:1px solid #ffffff12;color:#ddd}.boom{animation:boom .7s}@keyframes boom{50%{filter:brightness(2);transform:scale(1.04)}}@media(max-width:750px){.settings,.stats{grid-template-columns:repeat(2,1fr)}.stage{height:500px}.box{height:360px}.machine{bottom:20px}}@media(max-width:450px){.settings,.stats{grid-template-columns:1fr}.title h1{font-size:31px}}

<style>:root{--ink:#12305e;--ink-soft:#5a6b8c;--red:#c8202a;--gold:#ffc72c;--cream:#fff6e5}body{color:var(--ink);  background:    repeating-conic-gradient(from 0deg at 50% 6%,rgba(255,255,255,.16) 0deg 2.6deg,rgba(255,255,255,0) 2.6deg 8deg),    radial-gradient(120% 78% at 50% 4%,#ffe9a8 0%,#ffd97a 24%,#ff9a3c 60%,#f2622e 100%);  background-attachment:fixed}.wrap{max-width:1460px;padding:18px 22px 34px}.title h1{color:var(--ink);text-shadow:0 3px 0 #fff,0 6px 18px rgba(0,0,0,.18)}.title p{color:#8a4413;font-weight:700}.panel{background:rgba(255,251,242,.86);border:3px solid #fff;border-radius:26px;  box-shadow:0 18px 46px rgba(150,60,0,.32);padding:20px}.layout{display:grid;grid-template-columns:322px minmax(0,1fr) 272px;gap:16px;align-items:start}.col{display:flex;flex-direction:column;gap:12px}.mid{min-width:0}.pz{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:11px;  padding:11px 13px;border-radius:18px;background:var(--cream);  border:2px solid var(--c);box-shadow:0 5px 0 rgba(0,0,0,.10),0 9px 20px rgba(120,50,0,.18)}.pz.big{padding:14px;gap:13px;box-shadow:0 6px 0 rgba(0,0,0,.12),0 12px 26px rgba(120,50,0,.24)}.pz .th{height:62px;width:auto;max-width:74px;object-fit:contain;  filter:drop-shadow(0 4px 7px rgba(90,40,0,.35))}.pz.big .th{height:auto;max-height:88px;max-width:124px}.pz .tx{min-width:0;text-align:left}.pz .rk{display:block;font-size:13px;font-weight:900;letter-spacing:.1em;color:var(--c)}.pz.big .rk{font-size:16px}.pz .nm{display:block;margin-top:2px;font-size:14px;font-weight:900;line-height:1.3;color:var(--ink)}.pz.big .nm{font-size:17px}.pz .qt{display:block;margin-top:2px;font-size:11.5px;color:var(--ink-soft)}.pz .lf{text-align:center;line-height:1.05}.pz .lf b{display:block;font-size:24px;font-weight:900;color:var(--red)}.pz.big .lf b{font-size:30px}.pz .lf span{font-size:10.5px;color:var(--ink-soft)}.pz.empty{opacity:.45;filter:grayscale(.55)}.draw{margin:12px auto 14px;background:linear-gradient(180deg,#ffd7 const colors=PRIZES.map(p=>p.color), stock=PRIZES.map(p=>p.qty), TIERS=PRIZES.length;let balls=[],busy=false,logs=[];
const $=x=>document.getElementById(x), box=$("box"),stage=$("stage"), outBall=$("outBall");
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function names(){return PRIZES.map(p=>p.rank+"　"+p.name)}
function read(){}
function total(){return stock.reduce((a,b)=>a+b,0)}

function makeBalls(){
  box.innerHTML="";balls=[];
  outBall.style.animation = "none";
  outBall.style.opacity = "0";
  
  for(let c=0;c<TIERS;c++)for(let j=0;j<stock[c];j++){
    let e=document.createElement("div");e.className="ball";e.style.background=colors[c];e.textContent=String(j+1);
    // 給予強大的初始隨機速度 (X軸 -12~12, Y軸 -18~18)
    let b={
      e,c,num:j+1,
      x:30+Math.random()*(box.clientWidth-60),
      y:25+Math.random()*(box.clientHeight-60),
      vx:(Math.random()-.5)*24,
      vy:(Math.random()-.5)*36
    };
    balls.push(b);box.appendChild(e);
  }
  resizeBalls();
}

function resizeBalls(){let w=box.clientWidth-36,h=box.clientHeight-36;balls.forEach(b=>{b.x=Math.min(b.x,w);b.y=Math.min(b.y,h);b.e.style.transform=`translate(${b.x}px,${b.y}px)`})}

function animate(){
  if(!busy)return;
  let w=box.clientWidth-32, h=box.clientHeight-32;
  
  for(let b of balls){
    // 每次隨機給予微小微風推力，維持高能量亂飛
    b.vx += (Math.random() - 0.5) * 3;
    b.vy += (Math.random() - 0.5) * 3;
    
    b.x += b.vx;
    b.y += b.vy;
    
    // 牆面完全無損反彈（100% 反彈速度）
    if(b.x < 0 || b.x > w){
      b.x = Math.max(0, Math.min(w, b.x));
      b.vx *= -1;
    }
    if(b.y < 0 || b.y > h){
      b.y = Math.max(0, Math.min(h, b.y));
      b.vy *= -1;
    }
    
    // 限制最高與最低速度，避免速度過慢或無限飛出畫面
    let speed = Math.hypot(b.vx, b.vy);
    if(speed > 28) { b.vx *= 0.8; b.vy *= 0.8; }
    if(speed < 12) { b.vx *= 1.3; b.vy *= 1.3; }
    
    b.e.style.transform=`translate(${b.x}px,${b.y}px)`;
  }
  requestAnimationFrame(animate);
}

function pick(){let r=Math.random()*total();for(let i=0;i<TIERS;i++){if(r<stock[i])return i;r-=stock[i]}}
function prizeCard(p,i){
  return '<div class="pz' + (p.grand ? " big" : "") + (stock[i] ? "" : " empty")
    + '" style="--c:' + (p.ink || p.color) + '">'
    + '<img class="th" alt="" src="' + p.img + '">'
    + '<div class="tx">'
      + '<span class="rk">' + esc(p.rank) + '</span>'
      + '<span class="nm">' + esc(p.name) + '</span>'
      + '<span class="qt">共 ' + p.qty + " " + esc(p.unit) + '</span>'
    + '</div>'
    + '<div class="lf"><b>' + stock[i] + '</b><span>剩餘</span></div>'
  + '</div>';
}
function render(){
  var L = "", R = "";
  PRIZES.forEach(function(p,i){ if (p.grand) L += prizeCard(p,i); else R += prizeCard(p,i); });
  $("prizeLeft").innerHTML = L;
  $("prizeRight").innerHTML = R;
  $("stats").innerHTML = "";
}

function start(){
  if(busy)return;read();
  if(!total()){show("🎉 獎品已全數抽完","感謝參與");return}
  busy=true;$("draw").disabled=true;
  makeBalls();
  // 已移除 stage.classList.add("shake")，箱子不會搖晃
  $("result").innerHTML='<div class="big">🥁 抽獎中...</div>';
  animate();
  let duration=3500+Math.random()*1000;
  setTimeout(()=>finish(),duration);
}

function finish(){
  let win=pick(),n=names();
  stock[win]--;
  
  let candidates=balls.filter(b=>b.c===win);
  let chosen=candidates[Math.floor(Math.random()*candidates.length)];
  
  // 隱藏透明箱內中獎的球
  if(chosen) chosen.e.style.display="none";
  
  // 啟動推出動畫
  outBall.style.background = colors[win];
  outBall.textContent = chosen ? chosen.num : "1";
  outBall.style.animation = "pushOutBall 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards";
  
  setTimeout(()=>{
    stage.classList.add("boom");
    setTimeout(()=>stage.classList.remove("boom"), 700);
    show("🎊 "+n[win],"恭喜抽中！");
    logs.unshift({time:new Date().toLocaleTimeString("zh-TW"),name:n[win],left:stock[win]});
    renderHistory();
    render();
    busy=false;
    $("draw").disabled=false;
  }, 1300);
}

function show(a,b){$("result").innerHTML=`<div><div class="big">${esc(a)}</div><div class="small">${esc(b)}</div></div>`}
function renderHistory(){$("history").innerHTML=logs.length?logs.map((x,i)=>`<div>#${logs.length-i} ${x.time} 🎁 ${esc(x.name)} （剩 ${x.left}）</div>`).join(""):"尚無紀錄"}
window.addEventListener("resize",resizeBalls);render();makeBalls();
</script>

    try { return JSON.parse(localStorage.getItem(KEY) || "{}") || {}; }

    finish: function () {
      var s = load();

      s.tickets = (s.tickets || 0) + 1;
      save(s);
      return true;
    },
    // 抽完獎後歸零，換下一位民眾重新開始
    resetProgress: function () {
      save({ done: {}, tickets: 0 });

    addPrizeButton: function (anchor, where) {
