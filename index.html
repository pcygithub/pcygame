<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>玩遊戲 抽大獎｜反賄選偵探出動</title>
<meta name="description" content="法務部行政執行署新北分署 115年反賄選宣導 互動遊戲區">
<style>
  :root{
    --navy:#12305e;
    --navy-deep:#0b1f42;
    --blue:#2f7fc4;
    --blue-dark:#1b5590;
    --red:#c8202a;
    --red-soft:#e8535c;
    --green:#2f8f52;
    --gold:#ffc72c;
    --cream:#fdf7e8;
    --ink:#1b2740;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
    color:var(--ink);
    background:#14406e;
  }
  /* 固定的海報底：放射光芒 + 方格紙紋 */
  .bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/34px 34px,
      linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/34px 34px,
      repeating-conic-gradient(from 0deg at 50% 14%,
        rgba(255,255,255,.09) 0deg 2.4deg, rgba(255,255,255,0) 2.4deg 7.2deg),
      radial-gradient(120% 80% at 50% 10%, #59a8e0 0%, #2f7fc4 38%, #1b5590 78%, #14406e 100%);
  }

  .agency-bar{
    position:relative;z-index:3;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:11px 20px;
    background:rgba(11,31,66,.82);
    color:#eaf3ff;font-size:14px;font-weight:700;letter-spacing:.02em;
    box-shadow:0 2px 18px rgba(0,0,0,.28);
  }
  .agency-mark{
    display:grid;place-items:center;width:26px;height:26px;border-radius:8px;
    background:linear-gradient(140deg,#4aa3e8,#1f6fb8);
    font-size:15px;font-weight:900;color:#fff;
  }
  .agency-bar .pill{
    margin-left:auto;padding:4px 12px;border-radius:999px;
    background:rgba(255,199,44,.16);border:1px solid rgba(255,199,44,.5);
    color:var(--gold);font-size:12.5px;
  }

  /* 整頁依螢幕高度排版，不用捲動就看得完 */
  body{display:flex;flex-direction:column;min-height:100vh}
  .agency-bar{flex:0 0 auto}
  .shell{
    position:relative;z-index:2;flex:1 1 auto;
    display:flex;flex-direction:column;justify-content:center;
    gap:clamp(10px,2.2vh,24px);
    width:100%;max-width:1180px;margin:0 auto;
    padding:clamp(10px,2vh,22px) 20px clamp(12px,2vh,24px);
  }

  /* ---------- 上半：大標題 + 偵探 ---------- */
  .top{
    display:grid;grid-template-columns:1fr auto;
    align-items:center;gap:clamp(14px,3vw,46px);
  }
  .hero{text-align:left}
  .kicker{
    display:inline-block;transform:rotate(-1.6deg);
    padding:clamp(4px,.7vh,6px) clamp(13px,1.4vw,20px) clamp(5px,.8vh,7px);border-radius:6px;
    background:var(--red);color:#fff;
    font-size:clamp(12px,1.9vh,18px);font-weight:900;letter-spacing:.06em;
    box-shadow:0 4px 0 #8d1119, 0 10px 20px rgba(0,0,0,.3);
  }
  .headline{
    margin:clamp(6px,1.4vh,15px) 0 0;
    font-size:clamp(34px,8.4vh,92px);
    font-weight:900;line-height:.98;letter-spacing:.02em;
    color:#fff;
    -webkit-text-stroke:clamp(4px,.95vh,10px) var(--navy);
    paint-order:stroke fill;
    text-shadow:0 7px 0 var(--navy-deep), 0 15px 28px rgba(0,0,0,.42);
  }
  .headline .hl{color:var(--gold)}
  .headline .gap{display:inline-block;width:.3em}
  .ribbon{
    display:inline-block;margin-top:clamp(7px,1.5vh,16px);transform:rotate(.8deg);
    padding:clamp(6px,1vh,10px) clamp(16px,1.8vw,26px) clamp(7px,1.2vh,12px);
    background:linear-gradient(180deg,#ffd75c,#ffbe1f);
    color:#5a3b00;font-weight:900;
    font-size:clamp(12px,2vh,19px);letter-spacing:.03em;
    border-radius:4px;
    box-shadow:0 4px 0 #c08a00, 0 12px 22px rgba(0,0,0,.28);
  }
  .ribbon b{color:var(--red)}

  .hero-figure{position:relative;animation:bob 5s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-9px)}}
  .hero-figure img{
    display:block;width:auto;height:clamp(140px,30vh,320px);max-width:min(38vw,380px);
    object-fit:contain;
    filter:drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff)
           drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff)
           drop-shadow(0 20px 26px rgba(0,0,0,.45));
  }
  .spark{
    position:absolute;color:var(--gold);font-size:clamp(20px,3.4vh,34px);
    text-shadow:0 0 18px rgba(255,199,44,.85);
    animation:twinkle 2.6s ease-in-out infinite;
  }
  .spark.s1{top:2%;left:-4%}
  .spark.s2{top:24%;right:-2%;animation-delay:1.1s;font-size:clamp(15px,2.6vh,26px)}
  @keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

  /* ---------- 三個圈圈排成一列 ---------- */
  .stage{
    display:grid;grid-template-columns:repeat(3,1fr);
    justify-items:center;align-items:start;
    gap:clamp(10px,1.8vw,26px);
    padding-top:clamp(11px,2vh,22px);   /* 讓上方的標籤有空間 */
  }

  /* ---------- 圈圈按鈕（尺寸由 --d 統一決定，字級跟著等比縮放）---------- */
  .case{
    --accent:var(--red);
    --d:min(clamp(150px,27vh,258px), 29vw);
    display:block;width:var(--d);
    background:none;border:0;padding:0;
    font:inherit;color:inherit;text-align:center;text-decoration:none;
    cursor:pointer;
  }
  .case .disc{
    position:relative;
    width:var(--d);height:var(--d);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:calc(var(--d)*.022);
    padding:calc(var(--d)*.13) calc(var(--d)*.1) calc(var(--d)*.09);
    border-radius:50%;
    background:radial-gradient(circle at 50% 34%, #ffffff 0%, var(--wash) 100%);
    border:clamp(4px,.55vh,6px) solid var(--accent);
    box-shadow:0 14px 30px rgba(0,0,0,.35), inset 0 0 0 calc(var(--d)*.033) #fff;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .case:hover .disc,.case:focus-visible .disc{
    transform:translateY(-7px) scale(1.03);
    box-shadow:0 24px 42px rgba(0,0,0,.42), inset 0 0 0 calc(var(--d)*.033) #fff;
  }
  .case:active .disc{transform:translateY(-2px) scale(1.005)}
  .case .tag{
    position:absolute;top:calc(var(--d)*-.082);left:50%;transform:translateX(-50%) rotate(-2deg);
    display:flex;align-items:center;gap:calc(var(--d)*.026);white-space:nowrap;
    padding:calc(var(--d)*.028) calc(var(--d)*.075) calc(var(--d)*.032);border-radius:5px;
    background:var(--accent);color:#fff;
    font-size:calc(var(--d)*.105);font-weight:900;letter-spacing:.08em;
    box-shadow:0 4px 0 rgba(0,0,0,.28), 0 9px 16px rgba(0,0,0,.3);
  }
  .case .tag i{font-style:normal;font-size:calc(var(--d)*.085)}
  .case .no{
    font-size:calc(var(--d)*.048);font-weight:900;letter-spacing:.2em;
    color:var(--accent);opacity:.85;
  }
  .case .name{font-size:calc(var(--d)*.092);font-weight:900;line-height:1.2;color:var(--navy)}
  .case .desc{font-size:calc(var(--d)*.056);line-height:1.45;color:#4a5a76}
  .case .go{
    margin-top:calc(var(--d)*.022);
    padding:calc(var(--d)*.028) calc(var(--d)*.082);border-radius:999px;
    background:var(--accent);color:#fff;
    font-size:calc(var(--d)*.058);font-weight:900;letter-spacing:.04em;
    box-shadow:0 3px 0 rgba(0,0,0,.22);
  }
  .case .done{
    position:absolute;right:4%;top:12%;
    width:calc(var(--d)*.175);height:calc(var(--d)*.175);
    border-radius:50%;display:none;place-items:center;
    background:var(--green);color:#fff;font-size:calc(var(--d)*.095);font-weight:900;
    box-shadow:0 0 0 calc(var(--d)*.018) #fff, 0 6px 14px rgba(0,0,0,.3);
  }
  .case.is-done .done{display:grid}

  .case-bet{--accent:var(--red);--wash:#ffe7e6}
  .case-share{--accent:var(--green);--wash:#e2f6e6}
  .case-foreign{--accent:var(--blue-dark);--wash:#e2eefb}

  /* ---------- 抽獎區 ---------- */
  .prize{
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
    gap:clamp(12px,2vw,22px);
    padding:clamp(10px,1.8vh,20px) clamp(16px,2vw,28px);
    border-radius:clamp(16px,2.4vh,26px);
    background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(253,247,232,.94));
    border:clamp(3px,.4vh,4px) solid var(--gold);
    box-shadow:0 16px 38px rgba(0,0,0,.35);
  }
  .prize .icon{font-size:clamp(28px,4.4vh,52px);line-height:1;animation:bob 3.2s ease-in-out infinite}
  .prize .txt{flex:1 1 240px;min-width:0}
  .prize h2{margin:0 0 3px;font-size:clamp(16px,2.6vh,25px);font-weight:900;color:var(--navy)}
  .prize p{margin:0;font-size:clamp(11.5px,1.7vh,14.5px);line-height:1.55;color:#4a5a76}
  .prize p b{color:var(--red)}
  .prize .draw{
    padding:clamp(9px,1.5vh,15px) clamp(20px,2.6vw,34px);
    border:0;border-radius:999px;cursor:pointer;
    font:inherit;font-size:clamp(14px,2.2vh,19px);font-weight:900;letter-spacing:.05em;
    background:linear-gradient(180deg,#ffd75c,#ffb400);color:#4a3000;
    box-shadow:0 5px 0 #c08a00, 0 12px 22px rgba(0,0,0,.28);
    transition:transform .15s ease;
  }
  .prize .draw:hover{transform:translateY(-3px)}
  .prize .draw:active{transform:translateY(2px);box-shadow:0 3px 0 #c08a00}
  .prize .draw[data-locked="1"]{
    background:linear-gradient(180deg,#d9dee8,#bcc4d3);color:#68738a;
    box-shadow:0 5px 0 #98a1b3;cursor:not-allowed;
  }

  .foot{
    text-align:center;
    color:#dce9f8;font-size:clamp(11px,1.5vh,13.5px);font-weight:700;letter-spacing:.03em;
    text-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .foot .slogan{
    display:block;margin-bottom:clamp(3px,.7vh,7px);
    font-size:clamp(14px,2.7vh,25px);font-weight:900;color:#fff;
    -webkit-text-stroke:clamp(2px,.3vh,3px) var(--navy);paint-order:stroke fill;
    text-shadow:0 3px 0 var(--navy-deep);
  }
  .reset{
    margin-top:clamp(4px,.9vh,12px);background:none;border:0;cursor:pointer;
    font:inherit;font-size:11.5px;color:rgba(255,255,255,.5);text-decoration:underline;
  }

  /* 平板：三圈仍排一列，但縮小一點 */
  @media (max-width:1080px){
    .case{--d:min(clamp(140px,24vh,215px), 29vw)}
  }

  /* 手機：改回直式，允許捲動 */
  @media (max-width:820px){
    .shell{justify-content:flex-start;gap:22px;padding-bottom:30px}
    .top{grid-template-columns:1fr;justify-items:center;gap:14px}
    .hero{text-align:center}
    .headline{font-size:clamp(42px,13vw,72px);-webkit-text-stroke:clamp(5px,1.5vw,9px) var(--navy)}
    .kicker{font-size:clamp(13px,3.6vw,17px)}
    .ribbon{font-size:clamp(13px,3.8vw,18px)}
    .hero-figure img{height:auto;width:min(280px,62vw);max-width:none}
    .stage{grid-template-columns:1fr;gap:40px;padding-top:24px}
    .case{--d:min(290px,74vw)}
    .foot .slogan{font-size:clamp(16px,4.6vw,24px)}
  }
</style>
</head>

<header class="agency-bar">

    } catch (e) { return {}; }
  }
  function save(o) {
    try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
  }

  var state = load();
  state.done = state.done || {};
  state.tickets = state.tickets || 0;

  /* ---------- 套用設定 ---------- */
  Object.keys(GAMES).forEach(function (key) {
    var g = GAMES[key];
    var el = document.getElementById("game-" + key);
    el.href = encodeURI(g.file) + "?from=home&slot=" + key;
    el.querySelector(".name").textContent = g.name;
    el.querySelector(".desc").textContent = g.desc;
    if (state.done[key]) el.classList.add("is-done");
  });

  /* ---------- 抽獎按鈕 ---------- */
  var btn = document.getElementById("prize-btn");
  var note = document.getElementById("prize-note");

  function paintPrize() {
    if (state.tickets > 0) {
      btn.dataset.locked = "0";
      btn.textContent = "🎲 立即抽獎";
      note.innerHTML = "你目前有 <b>" + state.tickets + "</b> 次抽獎機會，快去轉一顆幸運球！";
    } else {
      btn.dataset.locked = "1";
      btn.textContent = "先去玩遊戲";
      note.innerHTML = "完成上面<b>任一款</b>遊戲，就能抽獎一次！";
    }
  }
  paintPrize();

  btn.addEventListener("click", function () {
    if (btn.dataset.locked === "1") {
      document.querySelector(".stage").scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    location.href = encodeURI(LOTTERY);
  });

  document.getElementById("reset-btn").addEventListener("click", function () {
    save({ done: {}, tickets: 0 });
    location.reload();
  });
})();
</script>
</body>
</html>
