        }

        var rain = stageEl.querySelector(".ad-rain");
        if (s >= 1) {
          if (!rain) {
            phone.insertAdjacentHTML("afterend",
              '<div class="ad-rain" aria-hidden="true"><i>廣告</i><i>廣告</i><i>廣告</i></div>');
          }
        } else if (rain) {
          rain.remove();
        }

        var warn = stageEl.querySelector(".warning-tag");
        if (s >= 2) {
          if (!warn) {
            stageEl.insertAdjacentHTML("beforeend", '<div class="warning-tag">來源不明</div>');
          }
        } else if (warn) {
          warn.remove();
        }
      }
    }
  };

  function renderStory() {
    var c = CASES[caseId];
    var node = html(
      '<div class="story-screen screen-enter story-' + c.id + '">' +
        '<div class="story-topline">' +
          "<div>" +
            '<span class="mini-label">案件 ' + c.number + "</span>" +
            "<strong>" + c.title + "</strong>" +
          "</div>" +
          '<button class="text-button">略過動畫</button>' +
        "</div>" +
        '<div class="story-stage stage-0">' + SCENES[c.id].base + "</div>" +
        '<div class="story-caption"></div>' +
        '<div class="story-progress" aria-label="動畫播放進度"><span></span></div>' +
      "</div>"
    );

    node.querySelector(".text-button").addEventListener("click", function () {
      clearTimers();
      stage = 3;
      renderQuestion();
    });

    swap(node);
    paintStage();
  }

  function paintStage() {
    var c = CASES[caseId];
    var screen = frame.querySelector(".story-screen");
    if (!screen) return;

    var stageEl = screen.querySelector(".story-stage");
    stageEl.className = "story-stage stage-" + stage;
    SCENES[c.id].update(stageEl, stage);

    var freeze = stageEl.querySelector(".freeze-overlay");
    if (stage === 3) {
      if (!freeze) {
        stageEl.insertAdjacentHTML("beforeend",
          '<div class="freeze-overlay">' +
            '<div class="freeze-badge">疑點出現！</div>' +
            '<div class="magnify-ring"></div>' +
          "</div>");
      }
    } else if (freeze) {
      freeze.remove();
    }

    // 字幕每一幕重新掛載，讓入場動畫重播（對應原版的 key 變更）
    var old = screen.querySelector(".story-caption");
    var caption = html(
      '<div class="story-caption">' +
        "<span>" + c.story[stage].eyebrow + "</span>" +
        "<h2>" + c.story[stage].title + "</h2>" +
      "</div>"
    );
    old.replaceWith(caption);
  }

  /* ---------- 題目 ---------- */
  function renderQuestion() {
    var c = CASES[caseId];
    var list = c.answers.map(function (a) {
      return '<button class="answer-button">' +
        "<span>" + a.id + "</span><strong>" + a.text + '</strong><b aria-hidden="true">›</b>' +
      "</button>";
    }).join("");

    var node = html(
      '<div class="question-screen screen-enter question-' + c.id + '">' +
        '<div class="question-heading">' +
          '<span class="detective-badge">偵探，輪到你了！</span>' +
          "<h2>" + c.question + "</h2>" +
          "<p>請點選一個最適當的處理方式</p>" +
        "</div>" +
        '<div class="answer-list">' + list + "</div>" +
        '<button class="replay-link">↻ 再看一次情境</button>' +
      "</div>"
    );

    node.querySelectorAll(".answer-button").forEach(function (btn, i) {
      btn.addEventListener("click", function () {
        selected = c.answers[i].id;
        renderResult();
      });
    });
    node.querySelector(".replay-link").addEventListener("click", function () {
      startStory(caseId);
    });
    swap(node);
  }

  /* ---------- 結果 ---------- */
  function renderResult() {
    var c = CASES[caseId];
    var ok = selected === c.correct;
    var confetti = new Array(18).fill("<i></i>").join("");

    var node = html(
      '<div class="result-screen screen-enter result-' + c.id + " " + (ok ? "correct-result" : "wrong-result") + '">' +
        '<div class="confetti" aria-hidden="true">' + confetti + "</div>" +
        '<div class="result-symbol" aria-hidden="true">' + (ok ? "✓" : "!") + "</div>" +
        '<span class="result-kicker">你的答案：' + selected + "</span>" +
        "<h2>" + (ok ? "案件破解成功！" : "差一點，再看清楚！") + "</h2>" +
        '<p class="result-lead">' + (ok ? c.correctLead : c.wrongLead) + "</p>" +
        '<div class="answer-reveal">' +
          '<div class="correct-answer-row">' +
            "<span>" + c.correct + "</span>" +
            "<div><small>正確答案</small><strong>" + c.correctText + "</strong></div>" +
          "</div>" +
          "<p>" + c.explanation + "</p>" +
        "</div>" +
        '<div class="slogan-card">' +
          "<span>" + c.sloganLabel + "</span>" +
          "<strong>" + c.slogan + "</strong>" +
          "<p>" + c.sloganNote + "</p>" +
        "</div>" +
        '<div class="result-actions">' +
          '<button class="primary-button">🎁 完成任務・去抽獎</button>' +
          '<button class="secondary-button">換一個案件</button>' +
          '<button class="secondary-button">再玩一次</button>' +
        "</div>" +
      "</div>"
    );

    var secondary = node.querySelectorAll(".secondary-button");
    node.querySelector(".primary-button").addEventListener("click", function () {
      if (window.ABD) ABD.lottery();
    });
    secondary[0].addEventListener("click", function () {
      clearTimers();
      selected = null;
      stage = 0;
      renderHome();
    });
    secondary[1].addEventListener("click", function () {
      startStory(caseId);
    });
    swap(node);
    if (window.ABD) ABD.finish();   // 破案完成，發一張抽獎券
  }

  /* ---------- 流程 ---------- */
  function swap(node) {
    frame.replaceChildren(node);
  }

  function startStory(id) {
    clearTimers();
    caseId = id || caseId;
    selected = null;
    stage = 0;
    renderStory();
    [3000, 6100, 9200].forEach(function (delay, index) {
      timers.push(setTimeout(function () {
        stage = index + 1;
        paintStage();
      }, delay));
    });
    timers.push(setTimeout(function () { renderQuestion(); }, 12200));
  }

  renderHome();
})();
</script>
<!-- ===== 反賄選宣導遊戲整合區塊（回主選單 / 抽獎券）===== -->
<style>
  .abd-home{
    position:fixed;left:14px;top:14px;z-index:2147483000;
    padding:9px 17px;border:0;border-radius:999px;cursor:pointer;
    font:900 14px/1 "Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
    color:#12305e;background:rgba(255,255,255,.93);
    box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  .abd-home:hover{background:#fff;transform:translateY(-1px)}
  /* 掛進遊戲自己的頁首列時，改成一般行內按鈕，避免蓋到標題 */
  .abd-home.abd-inline{
    position:static;margin-right:12px;flex:0 0 auto;
    padding:7px 14px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.28);
  }
  .abd-prize{
    display:inline-block;margin:10px 6px 0;padding:15px 32px;border:0;border-radius:999px;
    cursor:pointer;vertical-align:middle;
    font:900 19px/1 "Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
    color:#4a3000;background:linear-gradient(180deg,#ffd75c,#ffb400);
    box-shadow:0 6px 0 #c08a00, 0 12px 24px rgba(0,0,0,.3);
  }
  .abd-prize:active{transform:translateY(3px);box-shadow:0 3px 0 #c08a00}
</style>
<script>
window.ABD = (function () {
  "use strict";
  var KEY = "abd_progress_v1";
  var HOME = "index.html";
  var LOTTERY = "gemini-code-1788406942381.html";
  var SLOT = "foreign";
  try {
    var q = new URLSearchParams(location.search).get("slot");
    if (q) SLOT = q;
  } catch (e) {}

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") || {}; }
    catch (e) { return {}; }
  }
  function save(o) {
    try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
  }

  var api = {
    home: function () { location.href = HOME; },
    lottery: function () { location.href = LOTTERY; },
    tickets: function () { return load().tickets || 0; },
    useTicket: function () {
      var s = load();
      if (!(s.tickets > 0)) return false;
      s.tickets--; save(s); return true;
    },
    // 遊戲完成：同一輪裡同一款遊戲只發一張抽獎券
    finish: function () {
      var s = load();
      s.done = s.done || {};
      if (s.done[SLOT]) return false;
      s.done[SLOT] = 1;
      s.tickets = (s.tickets || 0) + 1;
      save(s);
      return true;
    },
    // 抽完獎後歸零，換下一位民眾重新開始
    resetProgress: function () {
      save({ done: {}, tickets: 0 });
    },
    // 在結束畫面插入「去抽獎」按鈕
    addPrizeButton: function (anchor, where) {
      if (!anchor) return null;
      var host = where === "after" ? anchor.parentNode : anchor;
      if (!host || host.querySelector(".abd-prize")) return null;
      var b = document.createElement("button");
      b.type = "button";
      b.className = "abd-prize";
      b.textContent = "🎁 去抽獎";
      b.addEventListener("click", api.lottery);
      if (where === "after") host.insertBefore(b, anchor);
      else host.insertBefore(b, host.firstChild);
      return b;
    }
  };

  function mountHomeButton() {
    if (document.querySelector(".abd-home")) return;
    var h = document.createElement("button");
    h.type = "button";
    h.className = "abd-home";
    h.textContent = "← 主選單";
    h.addEventListener("click", api.home);
    // 遊戲本身有頁首列的話就掛進去，沒有才浮在左上角
    var bar = ".agency-bar" ? document.querySelector(".agency-bar") : null;
    if (bar) {
      h.classList.add("abd-inline");
      bar.insertBefore(h, bar.firstChild);
    } else {
      document.body.appendChild(h);
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mountHomeButton);
  } else {
    mountHomeButton();
  }

  return api;
})();
</script>

</body>
